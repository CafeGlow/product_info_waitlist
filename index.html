<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">JAGAVE — Pre-launch ritual for inner radiance</title>
<meta name="description" content="JAGAVE — freeze-dried Arabica coffee blended with vegan collagen peptides, glutathione and skin-focused nutrients. One 10 g sachet, made for mornings. Join the pre-launch waitlist.">
<meta name="theme-color" content="#FDFBF7">
<link rel="canonical" href="https://jagave.com/">

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="JAGAVE — Pre-launch ritual for inner radiance">
<meta property="og:description" content="Freeze-dried Arabica coffee blended with vegan collagen peptides, glutathione and skin-focused nutrients. One 10 g sachet, made for mornings.">
<meta property="og:image" content="https://jagave.com/images/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://jagave.com/">
<meta property="og:site_name" content="JAGAVE">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="JAGAVE — Pre-launch ritual for inner radiance">
<meta name="twitter:description" content="Freeze-dried Arabica coffee blended with vegan collagen peptides, glutathione and skin-focused nutrients. One 10 g sachet, made for mornings.">
<meta name="twitter:image" content="https://jagave.com/images/og.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cursor-dot"></div>
<div class="cursor-ring"></div>

<!-- ============ NAV ============ -->
<nav class="nav" id="nav">
  <div class="nav-inner">
    <a href="#" class="nav-logo" data-hover><span id="nav-brand"></span><sup id="nav-mark"></sup></a>
    <ul class="nav-links" id="nav-links"></ul>
    <div class="nav-actions">
      <a href="#waitlist" class="nav-action" id="nav-waitlist" data-hover></a>
      <button class="nav-burger" id="nav-burger" aria-label="Menu">
        <span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<!-- Mobile Menu -->
<div class="mobile-menu" id="mobile-menu" data-list="mobile-nav"></div>

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="hero-grid">
    <div class="hero-left">
      <div class="hero-eyebrow" id="hero-eyebrow">
        <span class="dot"></span>
        <span class="label" id="hero-eyebrow-left"></span>
        <span class="line"></span>
        <span class="label" id="hero-eyebrow-right"></span>
      </div>

      <h1 class="hero-title" id="hero-title">
        <span id="hero-title-leading"></span><br>
        <em id="hero-title-emphasis"></em> <span id="hero-title-trailing"></span>
      </h1>

      <p class="hero-sub" id="hero-sub"></p>
      <div class="hero-ctas" id="hero-cta"></div>
      <div class="hero-meta" id="hero-meta"></div>
    </div>

    <div class="hero-right" id="hero-right">
      <div class="hero-frame">
        <span class="hero-frame-tag" id="hero-frame-tag"></span>
        <img id="hero-image" alt="">
        <span class="hero-frame-num" id="hero-frame-num"></span>
      </div>
      <span class="hero-side-text" id="hero-side-text"></span>
    </div>
  </div>
</section>

<!-- ============ MARQUEE ============ -->
<div class="marquee">
  <div class="marquee-track" data-list="marquee"></div>
</div>

<!-- ============ MANIFESTO ============ -->
<section class="manifesto" id="about">
  <div class="container">
    <div class="manifesto-head">
      <div>
        <span class="section-num" id="manifesto-section-num"></span>
        <span class="label" id="manifesto-label"></span>
      </div>
      <h2 class="serif" id="manifesto-title"></h2>
    </div>
    <p class="manifesto-text" id="manifesto-text"></p>
    <div class="manifesto-sig" id="manifesto-sig">
      <span class="sig-line"></span>
      <div>
        <div class="sig-text" id="manifesto-signature"></div>
        <div class="sig-name" id="manifesto-founder" style="margin-top: 0.6rem;"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ FEATURES 3-COLUMN ============ -->
<section class="features" id="features">
  <div class="container">
    <div class="features-head">
      <div class="left">
        <span class="section-num" id="principles-section-num"></span>
        <h2 class="serif" id="principles-title"></h2>
      </div>
      <div class="right"><p id="principles-description"></p></div>
    </div>
    <div class="features-grid" data-list="principles"></div>
  </div>
</section>

<!-- ============ FORMULA — HORIZONTAL PIN ============ -->
<section class="formula" id="formula">
  <div class="formula-head">
    <div>
      <span class="section-num" id="formula-section-num"></span>
      <h2 class="serif" id="formula-title"></h2>
    </div>
    <div class="right">
      <p id="formula-description"></p>
      <div class="meta" id="formula-meta"></div>
    </div>
  </div>

  <div class="pin-viewport" id="pin-viewport">
    <div class="pin-stage" id="pin-stage">
      <div class="pin-track" id="pin-track" data-list="ingredients"></div>
    </div>
  </div>

  <div class="pin-progress-wrap">
    <div class="pin-progress-label" id="pin-progress-label"></div>
    <div class="pin-progress"><div class="bar" id="pin-bar"></div></div>
    <div class="pin-instructions">
      <span class="arrow-h">→</span>
      <span id="pin-instructions"></span>
    </div>
  </div>
</section>

<!-- ============ RITUAL ============ -->
<section class="ritual" id="ritual">
  <div class="ritual-head">
    <span class="section-num" id="ritual-section-num"></span>
    <h2 class="serif" id="ritual-title"></h2>
    <p id="ritual-description"></p>
  </div>
  <div class="ritual-steps" data-list="ritual"></div>
</section>

<!-- ============ PRE-LAUNCH PREVIEW ============ -->
<section class="products" id="waitlist">
  <div class="container">
    <div class="products-head">
      <div>
        <span class="section-num" id="preview-section-num"></span>
        <h2 class="serif" id="preview-title"></h2>
      </div>
      <div class="right"><p id="preview-description"></p></div>
    </div>
    <div class="products-grid" data-list="preview"></div>
  </div>
</section>

<!-- ============ TESTIMONIAL ============ -->
<section class="testimonial">
  <blockquote>
    <div class="mark">"</div>
    <p id="testimonial-quote"></p>
    <cite>
      <span class="name" id="testimonial-name"></span>
      <span class="role" id="testimonial-role"></span>
    </cite>
  </blockquote>
</section>

<!-- ============ WAITLIST ============ -->
<section class="newsletter">
  <div class="newsletter-grid">
    <div>
      <span class="section-num" id="waitlist-section-num"></span>
      <h2 class="serif" id="waitlist-title"></h2>
      <p id="waitlist-description"></p>
    </div>
    <form class="newsletter-form" id="waitlist-form" novalidate>
      <div class="input-row">
        <input id="waitlist-email" type="email" required data-hover>
        <button type="submit" data-hover>
          <span id="waitlist-button"></span>
          <span>→</span>
        </button>
      </div>
      <label class="form-consent" for="waitlist-consent">
        <input type="checkbox" id="waitlist-consent" required>
        <span>I agree to the <a href="privacy.html">Privacy Policy</a> and to receive launch updates from JAGAVE.</span>
      </label>
      <div class="form-note" id="waitlist-note"></div>
      <div class="newsletter-success" id="waitlist-success"></div>
    </form>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer>
  <div class="footer-grid">
    <div class="footer-brand">
      <div class="logo"><span id="footer-brand"></span><sup id="footer-mark" style="font-family: var(--font-mono); font-size: 0.5rem; letter-spacing: 0.2em; color: var(--gold); margin-left: 0.4rem;"></sup></div>
      <p id="footer-description"></p>
    </div>
    <div class="footer-col">
      <h4 id="footer-explore-title"></h4>
      <ul id="footer-explore-links"></ul>
    </div>
    <div class="footer-col">
      <h4 id="footer-studio-title"></h4>
      <ul id="footer-studio-links"></ul>
    </div>
    <div class="footer-col">
      <h4 id="footer-connect-title"></h4>
      <ul id="footer-connect-links"></ul>
    </div>
  </div>
  <div class="footer-bottom">
    <span id="footer-copyright"></span>
    <span id="footer-credit"></span>
  </div>
</footer>

<button class="back-to-top" id="back-to-top" data-hover aria-label="Back to top">↑</button>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.3.13/dist/lenis.min.js"></script>
<script src="script.js"></script>

</body>
</html>
