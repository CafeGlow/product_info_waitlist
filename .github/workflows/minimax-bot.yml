name: MiniMax AI Coding Bot

on:
  issues:
    types: [opened, labeled]

concurrency:
  group: minimax-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  code-with-minimax:
    # Run for every newly opened issue, or when an existing issue gets the ai-edit label.
    if: github.event.action == 'opened' || github.event.label.name == 'ai-edit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: |
          python -m pip install --upgrade pip
          pip install aider-chat

      - name: Run MiniMax via Aider
        id: aider
        env:
          OPENAI_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          OPENAI_API_BASE: https://api.minimax.io/v1
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Pass issue content through environment variables so shell characters in
          # user-authored issues are handled as data rather than executable syntax.
          PROMPT=$(printf 'Issue Title: %s\n\nDetails:\n%s' "$ISSUE_TITLE" "$ISSUE_BODY")
          BRANCH_NAME="minimax/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH_NAME"

          aider --model openai/MiniMax-M2.5 \
                --yes \
                --no-auto-commits \
                --message "$PROMPT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --all

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "MiniMax implementation for Issue #${ISSUE_NUMBER}"
            git push origin "$BRANCH_NAME"
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.aider.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          BRANCH_NAME: ${{ steps.aider.outputs.branch }}
        run: |
          gh pr create \
            --title "MiniMax Fix: ${ISSUE_TITLE}" \
            --body "Automated PR generated by MiniMax via GitHub Actions for Issue #${ISSUE_NUMBER}." \
            --head "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}"
